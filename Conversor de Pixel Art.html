<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversor de Pixel Art</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f3efe6;--sf:#fffdf8;--tx:#1d1a2b;--mt:#6a647d;--ac:#2f4bd8;--ac2:#e8a317;--ln:#cfc8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16132a;--sf:#211d3a;--tx:#f1eefb;--mt:#a39dbf;--ac:#7c93ff;--ac2:#ffc84a;--ln:#3a3560}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 26px/1.1 "Courier New",monospace;margin:4px 0 4px;letter-spacing:-.5px}
p.s{color:var(--mt);margin:0 0 16px}
.drop{display:block;border:3px dashed var(--ln);background:var(--sf);padding:22px;text-align:center;cursor:pointer;font-weight:700}
.drop input{display:none}
.drop:focus-within,.drop:hover{border-color:var(--ac)}
.panel{background:var(--sf);border:2px solid var(--ln);padding:14px;margin-top:14px}
label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
label span{color:var(--ac);font-family:"Courier New",monospace}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chips button{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.chk{display:flex;gap:10px;align-items:center;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.out{margin-top:14px;background:repeating-conic-gradient(var(--ln) 0 25%,transparent 0 50%) 0 0/16px 16px;border:2px solid var(--ln);display:flex;justify-content:center}
canvas{max-width:100%;height:auto;image-rendering:pixelated;display:block}
.btn{display:block;width:100%;margin-top:12px;padding:14px;font:700 17px "Courier New",monospace;background:var(--ac2);color:#1d1a2b;border:0;cursor:pointer;box-shadow:4px 4px 0 var(--tx)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tx)}
.save{margin-top:12px;text-align:center;color:var(--mt)}
.save img{max-width:100%;image-rendering:pixelated;border:2px solid var(--ac);margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Conversor de Pixel Art</h1>
<p class="s">Escolha uma foto e transforme em pixel art. Tudo roda no seu celular, de graça.</p>

<label class="drop"><input type="file" id="f" accept="image/*">Toque para escolher uma imagem</label>

<div id="app" hidden>
 <div class="out"><canvas id="c"></canvas></div>
 <div class="panel">
  <label>Largura em pixels <span id="vw">64</span></label>
  <input type="range" id="w" min="16" max="256" value="64">
  <label>Paleta</label>
  <div class="chips" id="pal"></div>
  <div id="cb"><label>Cores por canal <span id="vl">5</span></label>
  <input type="range" id="l" min="2" max="8" value="5"></div>
  <label>Contraste <span id="vc">0</span></label>
  <input type="range" id="ct" min="-50" max="50" value="0">
  <label class="chk"><input type="checkbox" id="d"> Pontilhado (dithering)</label>
 </div>
 <button class="btn" id="sv">Salvar imagem</button>
 <div class="save" id="so" hidden>Segure a imagem e toque em “Baixar imagem”.<br><img id="si" alt="Pixel art pronta"></div>
</div>
</main>
<script>
const P={
 orig:null,
 gb:["#0f380f","#306230","#8bac0f","#9bbc0f"],
 pico:["#000000","#1d2b53","#7e2553","#008751","#ab5236","#5f574f","#c2c3c7","#fff1e8","#ff004d","#ffa300","#ffec27","#00e436","#29adff","#83769c","#ff77a8","#ffccaa"],
 bw:["#000000","#ffffff"],
 sepia:["#2b1d14","#6b4a2f","#b88a56","#f0d9a8"]
};
const names={orig:"Cores originais",gb:"Game Boy",pico:"PICO-8",bw:"Preto e branco",sepia:"Sépia"};
let img=null,pal="orig",pr={};
const $=id=>document.getElementById(id);
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
for(const k in P)if(P[k])pr[k]=P[k].map(hex);
const chips=$("pal");
for(const k in names){const b=document.createElement("button");b.textContent=names[k];b.setAttribute("aria-pressed",k===pal);b.onclick=()=>{pal=k;[...chips.children].forEach(x=>x.setAttribute("aria-pressed",x===b));$("cb").hidden=k!=="orig";run()};chips.appendChild(b)}
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function run(){
 if(!img)return;
 const w=+$("w").value,h=Math.max(1,Math.round(w*img.height/img.width));
 const c=$("c");c.width=w;c.height=h;
 const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
 x.drawImage(img,0,0,w,h);
 const id=x.getImageData(0,0,w,h),d=id.data,L=+$("l").value,ct=+$("ct").value,dt=$("d").checked;
 const f=(259*(ct+255))/(255*(259-ct));
 for(let y=0;y<h;y++)for(let i=0;i<w;i++){
  const o=(y*w+i)*4;
  if(d[o+3]<128){d[o+3]=0;continue}d[o+3]=255;
  const t=dt?(B[(y%4)*4+i%4]/16-.5)*(pal==="orig"?255/(L-1):90):0;
  let r=[0,1,2].map(j=>Math.max(0,Math.min(255,f*(d[o+j]-128)+128+t)));
  if(pal==="orig"){r=r.map(v=>Math.round(v/255*(L-1))*255/(L-1))}
  else{let bd=1e9,bc=null;for(const p of pr[pal]){const e=(p[0]-r[0])**2+(p[1]-r[1])**2+(p[2]-r[2])**2;if(e<bd){bd=e;bc=p}}r=bc}
  d[o]=r[0];d[o+1]=r[1];d[o+2]=r[2];
 }
 x.putImageData(id,0,0);
 $("vw").textContent=w;$("vl").textContent=L;$("vc").textContent=ct;
 $("so").hidden=true;
}
$("f").onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const i=new Image();
 i.onload=()=>{img=i;$("app").hidden=false;run();URL.revokeObjectURL(i.src)};
 i.onerror=()=>alert("Não foi possível abrir essa imagem. Tente outro arquivo.");
 i.src=URL.createObjectURL(file);
};
["w","l","ct","d"].forEach(k=>$(k).oninput=run);
$("sv").onclick=()=>{
 const c=$("c"),s=Math.max(1,Math.floor(1024/Math.max(c.width,c.height)));
 const o=document.createElement("canvas");o.width=c.width*s;o.height=c.height*s;
 const x=o.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(c,0,0,o.width,o.height);
 o.toBlob(async b=>{
  const file=new File([b],"pixel-art.png",{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==="AbortError")return}
  $("si").src=URL.createObjectURL(b);$("so").hidden=false;
  $("so").innerHTML='Segure a imagem e escolha “Baixar imagem”.<br><img id="si" alt="Pixel art pronta" src="'+URL.createObjectURL(b)+'">';
 },"image/png");
};
</script>
</body>
</html>
